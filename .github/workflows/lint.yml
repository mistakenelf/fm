name: lint

on: [push, pull_request]
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: "latest"
          only-new-issues: true
